name: PULL REQUEST CI

on:
  pull_request: # same repo pr
    branches:
      - main
    paths:
      - "spec-trait-inst/**"
      - "spec-trait-impl/**"
      - ".github/workflows/**"
  pull_request_target: # forked repo pr
    branches:
      - main
    paths:
      - "spec-trait-inst/**"
      - "spec-trait-impl/**"
      - ".github/workflows/**"

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
