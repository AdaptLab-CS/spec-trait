[package]
name = "spec-trait-eval-benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
spec-trait-macro = { path = "../../spec-trait-impl/crates/spec-trait-macro" }
itoa = "1"
ryu = "1"
memchr = "2"

[build-dependencies]
spec-trait-order = { path = "../../spec-trait-impl/crates/spec-trait-order" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "csv_output"] }

[[bench]]
name = "bench_all"
harness = false

[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[profile.bench]
opt-level = 3
lto = false
codegen-units = 16
